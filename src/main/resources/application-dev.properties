# Datasource — H2 in-memory, resets on every restart
spring.datasource.url=jdbc:h2:mem:aadati
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Flyway migrations specific to the dev/H2 schema
spring.flyway.locations=classpath:/db/migration/dev

# Logging
logging.level.com.mts.aadati=DEBUG
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.security=DEBUG

# Redis — local default
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# CORS
security.filter.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000}

# Rate Limiting
app.rate-limit.auth.capacity=5
app.rate-limit.auth.refill-tokens=5
app.rate-limit.auth.refill-duration=1m

app.rate-limit.api.capacity=100
app.rate-limit.api.refill-tokens=100
app.rate-limit.api.refill-duration=1m

app.rate-limit.anonymous.capacity=20
app.rate-limit.anonymous.refill-tokens=20
app.rate-limit.anonymous.refill-duration=1m
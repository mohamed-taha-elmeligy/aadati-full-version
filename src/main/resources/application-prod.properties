# Datasource — PostgreSQL, every value required
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.h2.console.enabled=false

spring.flyway.locations=classpath:/db/migration/product

logging.level.com.mts.aadati=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

# Mail
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# CORS
security.filter.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS}

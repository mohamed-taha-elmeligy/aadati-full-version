# Application
spring.application.name=aadati
server.port=${SERVER_PORT:8082}

# Active profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# RFC 7807 problem details
spring.mvc.problemdetails.enabled=true

# ===============================
# JPA / Hibernate — tuning that doesn't depend on which DB you're hitting
# ===============================
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

# Redis — pool
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

# Actuator + Micrometer
management.endpoints.web.exposure.include=metrics,caches

# Mail transport settings
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration=900000
security.jwt.refresh-expiration=604800000

# CORS
security.filter.cors.max-age=3600

# Default Admin seed — username can have a friendly fallback, password can't
app.admin.username=${APP_ADMIN_USERNAME}
app.admin.password=${APP_ADMIN_PASSWORD}
app.admin.email=${APP_ADMIN_EMAIL}
# Encryption
security.encryption.password.strength=11

# Baseline logging — safe everywhere; profiles raise/lower specific categories
logging.level.root=INFO

server.forward-headers-strategy=framework
